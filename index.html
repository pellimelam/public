
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Vidhwaan App Registration</title>

<meta name="description" content="Register as a Vidhwaan and create your official profile in the Vidhwaan community.">

<link rel="icon" href="/favicon.ico">

<!-- CSS -->
<link rel="stylesheet" href="./css/design-system.css">
<link rel="stylesheet" href="./css/main.css">

</head>

<body>

<!-- NAV -->
<div id="nav"></div>

<!-- HERO -->
<div id="hero"></div>

<!-- REGISTRATION -->
<div id="registration"></div>

<div id="edit"></div>

<div id="app"></div>

<!-- FOOTER -->
<div id="footer"></div>


<!-- MODULE LOAD -->
<script type="module">

import { loadNav } from "./utilities/nav.js"
import { loadHero } from "./utilities/hero.js"
import { loadFooter } from "./utilities/footer.js"
import { loadRegistration } from "./utilities/registration.js"
import { loadSupport } from "./utilities/support.js"
import { initRouter } from "./utilities/router.js"   // ✅ ADD THIS

const isProfile = window.location.pathname.match(/\d{10}$/);

if(!isProfile){
loadNav()
loadHero()
loadRegistration()
loadFooter()
loadSupport()
}

initRouter();

</script>


<!-- REGISTER FUNCTION -->

<script type="module">

import { initRouter } from "./utilities/router.js"

import { checkRepo, createRepo, createUserSite } from "./utilities/github.js";

document.addEventListener("click", async (e) => {

if(e.target.id !== "registerBtn") return;

/* =========================
   GET DATA
========================= */

const state = document.getElementById("state").value;
const district = document.getElementById("district").value;
const subdistrict = document.getElementById("subdistrict").value;
const village = document.getElementById("village").value;

const firstName = document.getElementById("firstName").value.trim();
const lastName = document.getElementById("lastName").value.trim();
const phone = document.getElementById("phone").value.trim();
const profession = document.getElementById("profession").value;

const resultEl = document.getElementById("result");

/* VALIDATION */

if(!state || !district || !subdistrict || !village){
alert("Please select complete location");
return;
}

if(!firstName || !lastName || !phone || !profession){
alert("Please fill all details");
return;
}

if(!/^[6-9][0-9]{9}$/.test(phone)){
alert("Enter valid mobile number");
return;
}

/* =========================
   PAYMENT
========================= */

resultEl.innerHTML = "Opening payment...";

const rzp = new Razorpay({
  key: "rzp_live_SO4F7YCOOnRVRZ",
  amount: 1,
  currency: "INR",
  name: "Vidhwaan",
  description: "Profile Registration",

  handler: async (response) => {

    if(!response.razorpay_payment_id){
      alert("Payment failed");
      return;
    }

    resultEl.innerHTML = "Creating profile...";

    /* =========================
       ORIGINAL FLOW
    ========================= */

    const exists = await checkRepo(phone);

    if(exists){
      resultEl.innerHTML = `
      <div style="color:#ef4444;">
      ❌ Profile already exists
      </div>`;
      return;
    }

    const status = await createRepo(phone);

    if(status !== "created"){
      resultEl.innerHTML = "❌ Error creating profile";
      return;
    }

    const data = {
      version: 1,
      firstName,
      lastName,
      phone,
      profession,
      location:{
        state,
        district,
        subdistrict,
        village
      },
      gallery: [],
      videos: []
    };

    await createUserSite({...data, village});

    const slug = `${firstName}${lastName}${phone}`.toLowerCase();
    const url = `https://app.vidhwaan.com/${slug}`;

    resultEl.innerHTML = `
    <div style="color:#22c55e;">
    ✅ Profile Created <br>
    <a href="${url}" target="_blank">${url}</a>
    </div>`;
  },

  modal: {
    ondismiss: () => {
      alert("Payment cancelled");
    }
  }
});

rzp.open();

});


</script> 


<!-- OPTIONAL CARD HOVER EFFECT -->
<script>

document.addEventListener("mousemove", (e) => {

document.querySelectorAll(".card").forEach(card => {

const rect = card.getBoundingClientRect();

const x = e.clientX - rect.left;
const y = e.clientY - rect.top;

card.style.setProperty("--x", x + "px");
card.style.setProperty("--y", y + "px");

});

});

</script>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  
</body>
</html>
